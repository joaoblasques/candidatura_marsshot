[project]
name = "nora"
version = "0.2.0"
description = "Nora — email-native AI executive assistant ('Drafts, You Send' trust loop + consent-gated meeting proposals)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pypdf>=6.13.3",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "dateparser>=1.4.1",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.55.0",
    "google-auth-oauthlib>=1.2.0",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Real-model evals cost API tokens — excluded by default; run with `-m eval`.
addopts = "-m 'not eval'"
markers = [
    "eval: real-model evaluation; requires ANTHROPIC_API_KEY; costs tokens; excluded by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
